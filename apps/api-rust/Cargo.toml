[workspace]
members = ["crates/domain", "crates/application", "crates/infrastructure", "crates/api"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
domain = { package = "zora-domain", path = "crates/domain" }
application = { package = "zora-application", path = "crates/application" }
infrastructure = { package = "zora-infrastructure", path = "crates/infrastructure" }
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "macros", "chrono"] }
deadpool-redis = "0.23.1"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
garde = { version = "0.23.0", features = ["derive", "email", "regex"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ts-rs = "12.0.1"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
chrono = "0.4.45"
uuid = { version = "1.26.1", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tower = { version = "0.5", features = ["util"] }
dotenvy = "0.15"
url = "2"

sha3 = "0.12.0"
base64 = "0.22.1"

futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
